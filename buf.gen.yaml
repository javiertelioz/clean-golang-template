version: v2
plugins:
  - local: protoc-gen-go
    out: pkg/interfaces/grpc/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: pkg/interfaces/grpc/gen
    opt: paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: pkg/interfaces/grpc/gen
    opt: paths=source_relative
  - local: protoc-gen-openapiv2
    out: pkg/interfaces/grpc/gen
    opt:
      - output_format=yaml
      - json_names_for_fields=false

